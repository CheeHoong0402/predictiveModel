name: Public release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python scripts/security_scan.py
      - run: python -m pytest tests/test_public_release.py tests/test_dashboard.py tests/test_recommendation_engine.py tests/test_model_governance.py -q
