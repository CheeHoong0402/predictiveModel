name: Daily Telegram restocking demo
on:
  # Telegram delivery is temporarily paused at the owner's request.
  # schedule:
  #   - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-telegram-summary
  cancel-in-progress: false
jobs:
  send:
    # Delivery stays paused even when manually dispatched; re-enable explicitly later.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate saved recommendations
        run: python scripts/send_daily_telegram_summary.py --dry-run
      - name: Send to configured private chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_daily_telegram_summary.py
