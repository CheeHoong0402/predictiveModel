# Configuration for Phase 12 Supplier Purchase-Price Forecasting Models
# Conservative default hyperparameters for model-family comparison; no extensive tuning yet.

evaluation:
  horizons: [1, 3, 7, 14, 21, 30]
  seed: 42
  holdout_start: '2024-10-01'
  holdout_end: '2024-12-31'
  flat_tolerance: 0.005  # Phase 9 standard: +/- 0.5% threshold for FLAT direction
  extreme_change_threshold: 0.50  # 50% change threshold for price shocks
  sample_weighting: 'balanced'  # Fold-internal balanced class weights for direction classifiers

models:
  regression:
    lightgbm:
      n_estimators: 80
      learning_rate: 0.05
      num_leaves: 31
      max_depth: 6
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      n_jobs: -1
      verbose: -1

    catboost:
      iterations: 80
      learning_rate: 0.05
      depth: 6
      l2_leaf_reg: 3.0
      random_seed: 42
      thread_count: -1
      verbose: 0
      nan_mode: 'Min'

    xgboost:
      n_estimators: 80
      learning_rate: 0.05
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: 'hist'
      random_state: 42
      n_jobs: -1

  classification:
    lightgbm:
      n_estimators: 80
      learning_rate: 0.05
      num_leaves: 31
      max_depth: 6
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      objective: 'multiclass'
      num_class: 3
      n_jobs: -1
      verbose: -1

    catboost:
      iterations: 80
      learning_rate: 0.05
      depth: 6
      l2_leaf_reg: 3.0
      random_seed: 42
      loss_function: 'MultiClass'
      thread_count: -1
      verbose: 0
      nan_mode: 'Min'

    xgboost:
      n_estimators: 80
      learning_rate: 0.05
      max_depth: 6
      subsample: 0.8
      colsample_bytree: 0.8
      tree_method: 'hist'
      objective: 'multi:softprob'
      num_class: 3
      random_state: 42
      n_jobs: -1

probabilistic:
  quantiles: [0.1, 0.5, 0.9]
  method: 'empirical_residual_quantiles'
  label: 'RAW_UNCALIBRATED'
