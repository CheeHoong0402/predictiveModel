project:
  name: "retail_predictive_system"
  country: "Malaysia"
  currency: "MYR"
  default_start_date: "2015-01-01"
  default_end_date: "2025-12-31"
  time_horizon_years: 10
  objective: "maximize_profit_minimize_food_wastage"

forecasting:
  target_demand_col: "historical_quantity_sold"
  target_price_col: "historical_supplier_purchase_price"
  forecast_horizon_days: 14
  safety_stock_service_level: 0.95
  models:
    - "lightgbm"
    - "xgboost"
    - "catboost"

optimisation:
  default_holding_cost_rate: 0.02
  default_wastage_cost_multiplier: 1.0
  default_stockout_penalty_multiplier: 1.5
  shelf_life_buffer_days: 2
  budget_limit_default: 100000.0

logging:
  level: "INFO"
