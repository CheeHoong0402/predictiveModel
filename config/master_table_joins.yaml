# config/master_table_joins.yaml
# ===============================
# Machine-readable specification for Phase 5 Master Daily Modelling Table Construction.
# Primary grain: one row = one product x one store x one calendar date (date + store_id + product_id).

core_skeleton:
  description: "Cartesian product of active stores, active products, and calendar days"
  primary_keys: ["date", "store_id", "product_id"]
  date_range: ["2021-01-01", "2024-12-31"]
  frequency: "daily"
  expected_rows: 35064

datasets:
  pos_sales:
    dataset_name: "Point-of-Sale Sales"
    cleaned_file_path: "data/interim/pos_sales_clean.parquet"
    dataset_frequency: "daily"
    primary_join_key: ["date", "store_id", "product_id"]
    secondary_join_key: null
    time_alignment_rule: "exact_calendar_date"
    geographic_alignment_rule: "exact_store_id"
    product_alignment_rule: "exact_product_id"
    allowable_forward_fill_policy: false
    allowable_backward_fill_policy: false
    maximum_validity_period: "1 day"
    publication_delay_considered: false
    required: true

  inventory:
    dataset_name: "Inventory History"
    cleaned_file_path: "data/interim/inventory_clean.parquet"
    dataset_frequency: "daily"
    primary_join_key: ["date", "store_id", "product_id"]
    secondary_join_key: null
    time_alignment_rule: "exact_calendar_date"
    geographic_alignment_rule: "exact_store_id"
    product_alignment_rule: "exact_product_id"
    allowable_forward_fill_policy: false
    allowable_backward_fill_policy: false
    maximum_validity_period: "1 day"
    publication_delay_considered: false
    required: true

  purchase_prices:
    dataset_name: "Purchase-price History"
    cleaned_file_path: "data/interim/purchase_prices_clean.parquet"
    dataset_frequency: "daily"
    primary_join_key: ["date", "store_id", "product_id"]
    secondary_join_key: "supplier_id"
    time_alignment_rule: "exact_calendar_date"
    geographic_alignment_rule: "exact_store_id"
    product_alignment_rule: "exact_product_id"
    allowable_forward_fill_policy: false
    allowable_backward_fill_policy: false
    maximum_validity_period: "1 day"
    publication_delay_considered: false
    required: true

  product_master:
    dataset_name: "Product Master"
    cleaned_file_path: "data/interim/product_master_clean.parquet"
    dataset_frequency: "static"
    primary_join_key: ["product_id"]
    secondary_join_key: null
    time_alignment_rule: "invariant_over_time"
    geographic_alignment_rule: "universal"
    product_alignment_rule: "exact_product_id"
    allowable_forward_fill_policy: false
    allowable_backward_fill_policy: false
    maximum_validity_period: "infinite"
    publication_delay_considered: false
    required: true

  store_master:
    dataset_name: "Store Master"
    cleaned_file_path: "data/interim/store_master_clean.parquet"
    dataset_frequency: "static"
    primary_join_key: ["store_id"]
    secondary_join_key: null
    time_alignment_rule: "invariant_over_time"
    geographic_alignment_rule: "exact_store_id"
    product_alignment_rule: "universal"
    allowable_forward_fill_policy: false
    allowable_backward_fill_policy: false
