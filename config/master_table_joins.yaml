    dataset_frequency: "event_interval"
    primary_join_key: ["product_category"]
    secondary_join_key: ["date_interval"]
    time_alignment_rule: "interval_containment (start_date <= date <= end_date)"
    geographic_alignment_rule: "national_chain_wide"
