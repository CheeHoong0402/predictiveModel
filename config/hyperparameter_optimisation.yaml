# Configuration for Phase 14 Compute-Efficient Hyperparameter Optimisation
evaluation:
  horizons: [1, 3, 7, 14, 21, 30]
  priority_horizons: [1, 7, 30]
  seed: 42
  holdout_start: '2024-10-01'
  holdout_end: '2024-12-31'
  screening_trials: 8
  refinement_trials: 6
  early_stopping_rounds: 30
  plateau_patience: 3
  min_improvement_pct: 0.1
  practical_improvement_threshold: 0.002 # 0.2% minimum relative improvement to accept model complexity
  timeout_seconds: 1800
  db_path: 'optuna_studies/phase14.db'
  screening_folds_step: 3 # Representative development folds for fast screening
  demand_objective: 'wape'
  price_objective: 'mae'

hardware:
  cpu_threads: 14
  gpu_device: 0
  use_gpu_for_catboost: true
  max_concurrent_jobs: 1
  target_ram_limit_gb: 20.0

models:
  demand:
    primary_family: 'lightgbm' # Fast, ultra-responsive, champion on 1d and close runner-up across all horizons
    secondary_family: 'catboost' # Champion on 7d, 14d, 21d, 30d
    fixed_max_estimators: 300
    early_stopping: 30
  price:
    primary_family: 'lightgbm'
    secondary_family: 'catboost'
    approach: 'percentage_change' # Phase 12 champion approach winning all 6 horizons
    fixed_max_estimators: 300
    early_stopping: 30

search_spaces:
  lightgbm:
    num_leaves_min: 16
    num_leaves_max: 96
    max_depth_min: 4
    max_depth_max: 9
    learning_rate_min: 0.01
    learning_rate_max: 0.12
    min_child_samples_min: 10
    min_child_samples_max: 60
    subsample_min: 0.70
    subsample_max: 1.0
    colsample_bytree_min: 0.70
    colsample_bytree_max: 1.0
    reg_alpha_min: 0.001
    reg_alpha_max: 5.0
    reg_lambda_min: 0.001
    reg_lambda_max: 5.0

  catboost:
    depth_min: 4
    depth_max: 8
    learning_rate_min: 0.01
    learning_rate_max: 0.12
    l2_leaf_reg_min: 1.0
    l2_leaf_reg_max: 15.0
    random_strength_min: 0.0
    random_strength_max: 2.0
    bagging_temperature_min: 0.0
    bagging_temperature_max: 1.0
