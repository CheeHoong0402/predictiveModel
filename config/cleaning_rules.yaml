date_standards:
  daily_format: "%Y-%m-%d"
  timestamp_format: "ISO8601"
  earliest_valid_year: 1980
  latest_valid_year: 2030

identifier_standards:
  preserve_leading_zeroes: true
  cast_to_string: true
  keys:
    - "store_id"
    - "product_id"
    - "supplier_id"
    - "promotion_id"
    - "item_code"
    - "premise_code"

monetary_standards:
  currency: "MYR"
  clean_currency_symbols: ["RM", "rm", "MYR", ","]
  precision: 2

boolean_standards:
  truthy_values: ["yes", "y", "true", "1", 1, True]
  falsy_values: ["no", "n", "false", "0", 0, False]

geographic_standards:
  malaysia_latitude_bounds: [0.8, 7.5]
  malaysia_longitude_bounds: [99.5, 119.5]
  state_mappings:
    "Penang": "Pulau Pinang"
    "Pulau Pinang": "Pulau Pinang"
    "Kuala Lumpur": "W.P. Kuala Lumpur"
    "W.P. Kuala Lumpur": "W.P. Kuala Lumpur"
    "Wilayah Persekutuan Kuala Lumpur": "W.P. Kuala Lumpur"
    "KL": "W.P. Kuala Lumpur"
    "Selangor": "Selangor"
    "Johor": "Johor"
    "Perak": "Perak"
    "Pahang": "Pahang"
    "Sabah": "Sabah"
    "Sarawak": "Sarawak"
    "Kedah": "Kedah"
    "Melaka": "Melaka"
    "Negeri Sembilan": "Negeri Sembilan"
    "Terengganu": "Terengganu"
    "Kelantan": "Kelantan"
    "Perlis": "Perlis"
    "W.P. Labuan": "W.P. Labuan"
    "W.P. Putrajaya": "W.P. Putrajaya"

numeric_bounds:
  selling_price: [0.10, 5000.0]
  purchase_price: [0.10, 5000.0]
  quantity_sold: [0, 50000]
  inventory_quantity: [0, 100000]
  temperature: [15.0, 42.0]
  rainfall: [0.0, 500.0]
  humidity: [30.0, 100.0]
  wind_speed: [0.0, 150.0]

cpi_divisions:
  food_and_beverage: "01"
  overall: "overall"

ppi_series:
  overall: "overall"
  agriculture: "agriculture"
  manufacturing: "manufacturing"
